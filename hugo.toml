baseURL = "https://grafioschtrader.github.io/gt-user-manual/"
locale = "de-de"
title = "Grafioschtrader"
theme = "hugo-theme-relearn"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir= true

[outputs]
    home = [ 'html', 'rss']

[params]
   showVisitedLinks = false
   disableLanguageSwitchingButton = false
   disableLandingPageButton = true
   themeVariant = "grafioschtrader"
   disableNextPrev = true
   mermaidZoom = true
   alwaysopen = false
   collapsibleMenu = true


[Languages]
    [Languages.de]
        title = "Bedienungsanleitung Grafioschtrader"
        weight = 1
        label = "Deutsch"

    [Languages.en]
        title = "User manual Grafioschtrader"
        weight = 2
        label = "English"

[markup]
  [markup.goldmark.extensions]
    strikethrough = false
  [markup.goldmark.extensions.extras.delete]
    enable = true
  [markup.goldmark.extensions.extras.subscript]
    enable = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineAnchors = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    style = "monokailight"
    tabWidth = 4        